        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --header-bg: #f8f9fa;
            --border-color: #e0e0e0;
        }

        [data-theme="dark"] {

            --text-color: #ffffff;
            --header-bg: #2d2d2d;
            --border-color: #404040;

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 20px;
            z-index: 1000;
        }

        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s ease;
        }

        .name {
            font-size: 96px;
            font-weight: 700;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .profile-section {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 60px;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 200px;
            padding-top: calc((200px - 96px) / 2);
        }

        .name {
            line-height: 1;
            margin-top: 0;
        }

        .socials-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 12px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 18px;
        }

        .social-icon {
            display: inline-flex;
            align-items: center;
            width: 20px;
            height: 20px;
            text-decoration: none;
        }

        .social-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(var(--icon-invert, 0));
            transition: filter 0.3s ease;
        }

        [data-theme="dark"] .social-icon img {
            filter: brightness(0) saturate(100%) invert(1);

        .social-account {
            font-weight: 500;
            text-decoration: none;

        .social-link:hover .social-account {

    </style>
</head>
<body>
    <header>
        <label class="theme-toggle-label">
            <input type="checkbox" class="theme-toggle-input" id="themeToggle" aria-label="Toggle dark mode">
            <span class="theme-toggle-slider"></span>
        </label>
    </header>
    <div class="loading-overlay" id="loading-overlay"></div>
    <main>
        <div class="profile-section">
            <img src="github_profile_pic.jpeg" alt="Aditya Behera" class="profile-image">
            <div class="profile-info">
                <h1 class="name">Aditya Behera</h1>
                <div id="socials-container" class="socials-container"></div>
            </div>
        </div>
        <div class="projects-section">
            <h2 class="projects-heading">Projects</h2>
            <div class="projects-container" id="projects-container">
                <button class="projects-nav-button prev" id="projects-prev" aria-label="Previous projects">‹</button>
                <div class="projects-carousel" id="projects-carousel"></div>
                <button class="projects-nav-button next" id="projects-next" aria-label="Next projects">›</button>
            </div>
        </div>
        <div class="timeline-section">
            <h2 class="timeline-heading">Timeline</h2>
            <div class="timeline-container" id="timeline-container"></div>
        </div>
        <!-- Content will go here -->
    </main>

    <script>
        // Global loading tracker
        window.contentLoaded = {
            socials: false,
            projects: false,
            timeline: false
        };

        window.checkAllLoaded = function() {
            if (window.contentLoaded.socials && window.contentLoaded.projects && window.contentLoaded.timeline) {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.classList.add('hidden');
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 1500);
                }
            }
        };
    </script>
    <script src="socials.js"></script>
    <script src="projects.js"></script>
    <script src="timeline.js"></script>
    <script>
        // Get theme from localStorage or default to light
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        
        const themeToggle = document.getElementById('themeToggle');
        // Set initial checkbox state based on theme
        themeToggle.checked = currentTheme === 'dark';
        
        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
